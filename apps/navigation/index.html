<!doctype html>
<html lang="zh-CN">
<head>

<body>
  <div class="aurora aurora-one"></div><div class="aurora aurora-two"></div>

      <form class="search-box" id="webSearch" role="search">

  <footer><a class="brand mini" href="#top"><span>拾</span>拾光导航</a><p>把好用的英语资源，整理成简单的入口。</p><span>© 2026 SHIGUANG</span></footer>
