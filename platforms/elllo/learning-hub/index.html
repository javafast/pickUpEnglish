    const list=document.querySelector('#lessonList'),frame=document.querySelector('#lessonFrame'),search=document.querySelector('#search');let type='video',lessons=groups.video,current=0;
    function render(query=''){const q=query.trim().toLowerCase();const filtered=lessons.filter(item=>!q||item.title.toLowerCase().includes(q)||String(item.n).includes(q));list.innerHTML=filtered.length?filtered.map(item=>`<button class="lesson${item.n===lessons[current].n?' active':''}" type="button" data-index="${item.n-1}"><span class="num">${String(item.n).padStart(2,'0')}</span><span><strong>${item.title}</strong><small>A2 · ${meta[type].label}</small></span></button>`).join(''):'<p class="empty">没有找到对应课程。</p>'}
    function openLesson(index){current=Math.max(0,Math.min(lessons.length-1,index));const item=lessons[current];frame.src=item.url;frame.title=`ELLLO A2 ${meta[type].name} ${item.n}: ${item.title}`;document.querySelector('#lessonNumber').textContent=`${meta[type].name} · ${String(item.n).padStart(2,'0')}`;document.querySelector('#lessonTitle').textContent=item.title;document.querySelector('#external').href=item.url;render(search.value);document.querySelector(`.lesson[data-index="${current}"]`)?.scrollIntoView({block:'nearest'});localStorage.setItem(`elllo-a2-${type}`,String(current))}
    function setType(next){type=groups[next]?next:'video';lessons=groups[type];search.value='';document.querySelectorAll('.type').forEach(button=>button.classList.toggle('active',button.dataset.type===type));document.querySelector('#typeName').textContent=meta[type].name;document.querySelector('#lessonCount').textContent=lessons.length;const saved=Number(localStorage.getItem(`elllo-a2-${type}`));openLesson(Number.isInteger(saved)&&saved>=0&&saved<lessons.length?saved:0);history.replaceState(null,'',`?type=${type}`)}
    list.addEventListener('click',event=>{const button=event.target.closest('.lesson');if(button)openLesson(Number(button.dataset.index))});search.addEventListener('input',()=>render(search.value));document.querySelector('#previous').addEventListener('click',()=>openLesson(current-1));document.querySelector('#next').addEventListener('click',()=>openLesson(current+1));document.querySelector('#types').addEventListener('click',event=>{if(event.target.dataset.type)setType(event.target.dataset.type)});setType(new URLSearchParams(location.search).get('type')||'video');
  </script>

  <script>(()=>{const button=document.querySelector('#railToggle'),icons=document.querySelector('.rail-icons');const render=collapsed=>{document.body.classList.toggle('rail-collapsed',collapsed);button.setAttribute('aria-expanded',String(!collapsed));button.setAttribute('aria-label',collapsed?'展开菜单':'收起菜单');button.title=collapsed?'展开菜单':'收起菜单'};const syncType=type=>icons.querySelectorAll('[data-rail-type]').forEach(icon=>icon.classList.toggle('active',icon.dataset.railType===type));render(true);syncType(new URLSearchParams(location.search).get('type')||'video');button.addEventListener('click',()=>render(!document.body.classList.contains('rail-collapsed')));icons.addEventListener('click',event=>{const type=event.target.closest('[data-rail-type]')?.dataset.railType;if(!type)return;document.querySelector(`.type[data-type="${type}"]`)?.click();syncType(type)})})()</script>
