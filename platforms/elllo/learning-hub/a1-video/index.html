    const meta={views:{name:'自然对话',label:'Natural Conversations'},video:{name:'一分钟视频',label:'One Minute English'},book:{name:'语法对话',label:'Grammar Conversations'}};
    const list=document.querySelector('#lessonList'),frame=document.querySelector('#lessonFrame'),search=document.querySelector('#search');let type='video',activeLessons=groups.video,current=0;
    function render(query=''){const q=query.trim().toLowerCase();const filtered=activeLessons.filter(item=>!q||item.title.toLowerCase().includes(q)||String(item.n).includes(q));list.innerHTML=filtered.length?filtered.map(item=>`<button class="lesson${item.n===activeLessons[current].n?' active':''}" type="button" data-index="${activeLessons.indexOf(item)}"><span class="num">${String(item.n).padStart(2,'0')}</span><span><strong>${item.title}</strong><small>A1 · ${meta[type].label}</small></span></button>`).join(''):'<p class="empty">没有找到对应课程。</p>'}
    function openLesson(index){current=Math.max(0,Math.min(activeLessons.length-1,index));const item=activeLessons[current];frame.src=item.url;frame.title=`ELLLO A1 ${meta[type].name} ${item.n}: ${item.title}`;document.querySelector('#lessonNumber').textContent=`${meta[type].name} · ${String(item.n).padStart(2,'0')}`;document.querySelector('#lessonTitle').textContent=item.title;document.querySelector('#external').href=item.url;render(search.value);document.querySelector(`.lesson[data-index="${current}"]`)?.scrollIntoView({block:'nearest'});localStorage.setItem(`elllo-a1-${type}`,String(current))}
    function setType(next){type=groups[next]?next:'video';activeLessons=groups[type];search.value='';document.querySelectorAll('.type').forEach(button=>button.classList.toggle('active',button.dataset.type===type));document.querySelector('#typeName').textContent=meta[type].name;document.querySelector('#lessonCount').textContent=activeLessons.length;const saved=Number(localStorage.getItem(`elllo-a1-${type}`));openLesson(Number.isInteger(saved)&&saved>=0&&saved<activeLessons.length?saved:0);history.replaceState(null,'',`?type=${type}`)}
    list.addEventListener('click',event=>{const button=event.target.closest('.lesson');if(button)openLesson(Number(button.dataset.index))});search.addEventListener('input',()=>render(search.value));document.querySelector('#previous').addEventListener('click',()=>openLesson(current-1));document.querySelector('#next').addEventListener('click',()=>openLesson(current+1));document.querySelector('#types').addEventListener('click',event=>{if(event.target.dataset.type)setType(event.target.dataset.type)});setType(new URLSearchParams(location.search).get('type')||'video');
  </script>
  <script>window.addEventListener('message',event=>{if(!/^https:\/\/(www\.)?elllo\.org$/.test(event.origin)||event.data?.source!=='shiguang-elllo'||event.data?.action!=='next')return;document.querySelector('#next')?.click()})</script>
  <script>(()=>{const button=document.querySelector('#railToggle'),icons=document.querySelector('.rail-icons');const render=collapsed=>{document.body.classList.toggle('rail-collapsed',collapsed);button.setAttribute('aria-expanded',String(!collapsed));button.setAttribute('aria-label',collapsed?'展开菜单':'收起菜单');button.title=collapsed?'展开菜单':'收起菜单'};const syncType=type=>icons.querySelectorAll('[data-rail-type]').forEach(icon=>icon.classList.toggle('active',icon.dataset.railType===type));render(true);syncType(new URLSearchParams(location.search).get('type')||'video');button.addEventListener('click',()=>render(!document.body.classList.contains('rail-collapsed')));icons.addEventListener('click',event=>{const type=event.target.closest('[data-rail-type]')?.dataset.railType;if(!type)return;document.querySelector(`.type[data-type="${type}"]`)?.click();syncType(type)})})()</script>
